services:
  workadventure-presence-notifier:
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      # Uncomment when workadventure.entrance_url is configured.
      # SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:?Set SLACK_SIGNING_SECRET}"
      # Set destination.slack.interactions_listen to "0.0.0.0:8080" in config.yaml.
      # Route /slack/interactions through an HTTPS proxy on a shared Docker network.
      # Do not publish the listener directly; see README HTTP interaction setup.
    volumes:
      - ./config.yaml:/etc/workadventure-presence-notifier/config.yaml:ro
      - notifier-state:/var/lib/workadventure-presence-notifier
    command:
      - --config
      - /etc/workadventure-presence-notifier/config.yaml
    networks:
      - workadventure

networks:
  workadventure:
    external: true
    name: "${WORKADVENTURE_NETWORK:-workadventure_default}"

volumes:
  notifier-state:
