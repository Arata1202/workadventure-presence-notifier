services:
  workadventure-presence-notifier:
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
    volumes:
      - ./config.yaml:/etc/workadventure-presence-notifier/config.yaml:ro
      - notifier-state:/var/lib/workadventure-presence-notifier
    command:
      - --config
      - /etc/workadventure-presence-notifier/config.yaml
    networks:
      - workadventure

networks:
  workadventure:
    external: true
    name: "${WORKADVENTURE_NETWORK:-workadventure_default}"

volumes:
  notifier-state:
