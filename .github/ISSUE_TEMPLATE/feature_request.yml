name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Describe the problem before proposing implementation details.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and configuration.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other designs you considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any affected WorkAdventure versions, notifiers, configuration keys, or deployment methods.

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security considerations
      description: Explain whether the feature processes, stores, or exposes user presence data or credentials.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have not included secrets or real user presence data.
          required: true
