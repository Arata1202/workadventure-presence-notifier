name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Remove all secrets and personal presence data before submitting.

  - type: input
    id: notifier_version
    attributes:
      label: Notifier version
      description: Provide a release version or commit SHA.
      placeholder: v1.0.0 or be07297
    validations:
      required: true

  - type: input
    id: workadventure_version
    attributes:
      label: WorkAdventure version
      placeholder: v1.34.2
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Docker CLI
        - Standalone binary
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and how it affects the deployment.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Start ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, destination and message identifiers, user names, room URLs, IP addresses, and other sensitive data.
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Include relevant configuration with secrets and personal data replaced by placeholders.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, production identifiers, and personal presence data.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
