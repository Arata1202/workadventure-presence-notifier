workadventure:
  address: "back:50051"
  # Optional button: requires SLACK_SIGNING_SECRET and an HTTPS proxy callback route.
  # entrance_url: "https://office.example.invalid/entrance"
  # entrance_label: "Open WorkAdventure"
  room_discovery_interval: "30s"
  reconnect_interval: "5s"
  initial_sync_timeout: "2s"
  request_timeout: "10s"

status:
  debounce: "5s"
  shutdown_timeout: "10s"
  state_file: "/var/lib/workadventure-presence-notifier/state.json"

destination:
  slack:
    # Only used when entrance_url is set; see README for container proxy routing.
    # interactions_listen: "0.0.0.0:8080"
    channel_id: "C0123456789"
    message: "Currently online ({{ .Count }}): {{ .Users }}"
    user_separator: ", "
    request_timeout: "10s"
